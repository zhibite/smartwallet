name: smartwallet

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: smartwallet-postgres
    labels:
      - "coolify.managed=true"
      - "coolify.resource=postgres"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      POSTGRES_DB: ${POSTGRES_DB:-smartwallet}
    volumes:
      - smartwallet-pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart} -d ${POSTGRES_DB:-smartwallet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Coolify 会通过反代把 5432 映射到宿主机；如果你只允许容器内访问可注释掉
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: smartwallet-redis
    labels:
      - "coolify.managed=true"
      - "coolify.resource=redis"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - smartwallet-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    expose:
      - "6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: smartwallet-web
    labels:
      - "coolify.managed=true"
      - "coolify.resource=web"
      - "coolify.port=3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 连同 host 网络里的 postgres/redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      DIRECT_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: smartwallet-worker
    labels:
      - "coolify.managed=true"
      - "coolify.resource=worker"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      DIRECT_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  smartwallet-pgdata:
    name: smartwallet-pgdata
  smartwallet-redisdata:
    name: smartwallet-redisdata

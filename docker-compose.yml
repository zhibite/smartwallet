services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: smartwallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      POSTGRES_DB: ${POSTGRES_DB:-smartwallet}
    volumes:
      - smartwallet-pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart} -d ${POSTGRES_DB:-smartwallet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: smartwallet-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - smartwallet-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: smartwallet-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      DIRECT_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: "0.0.0.0"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/auth/me"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: smartwallet-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      DIRECT_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  smartwallet-pgdata:
    name: smartwallet-pgdata
  smartwallet-redisdata:
    name: smartwallet-redisdata

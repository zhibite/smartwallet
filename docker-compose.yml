services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: smartwallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart}
      POSTGRES_DB: ${POSTGRES_DB:-smartwallet}
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart} -d ${POSTGRES_DB:-smartwallet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: smartwallet-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartwallet-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      DIRECT_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL:-https://mainnet.helius-rpc.com}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NODE_ENV: production
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: smartwallet-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      DIRECT_URL: postgresql://${POSTGRES_USER:-smart}:${POSTGRES_PASSWORD:-smart}@postgres:5432/${POSTGRES_DB:-smartwallet}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      HELIUS_RPC_URL: ${HELIUS_RPC_URL:-https://mainnet.helius-rpc.com}
      BIRDEYE_API_KEY: ${BIRDEYE_API_KEY:-}
      NODE_ENV: production
      WORKER_CRON_TX_SYNC: ${WORKER_CRON_TX_SYNC:-*/30 * * * * *}
      WORKER_CRON_SNAPSHOT: ${WORKER_CRON_SNAPSHOT:-*/5 * * * *}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
